<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Page title</title>
  <meta name="description" content="One sentence about this page.">
  <style>
    :root {
      --bg: #ffffff; --surface: #f5f6f8; --text: #14161a; --muted: #5b6270;
      --accent: #2456e6; --accent-text: #ffffff; --border: #e3e6eb;
      --radius: 12px; --space-1: .25rem; --space-2: .5rem; --space-3: 1rem; --space-4: 1.5rem; --space-5: 2.5rem; --space-6: 4rem;
      --step-0: clamp(1rem, .95rem + .25vw, 1.125rem);
      --step-1: clamp(1.25rem, 1.1rem + .6vw, 1.5rem);
      --step-2: clamp(1.6rem, 1.3rem + 1.4vw, 2.25rem);
      --step-3: clamp(2rem, 1.5rem + 2.6vw, 3.25rem);
      color-scheme: light dark;
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #0f1115; --surface: #181b21; --text: #eceef2; --muted: #a2a9b6; --accent: #7aa2ff; --accent-text: #0f1115; --border: #2a2f38; }
    }
    *, *::before, *::after { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body { margin: 0; background: var(--bg); color: var(--text); font: 400 var(--step-0)/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    img, svg, video { max-width: 100%; height: auto; display: block; }
    h1, h2, h3 { line-height: 1.15; margin: 0 0 var(--space-3); }
    h1 { font-size: var(--step-3); } h2 { font-size: var(--step-2); } h3 { font-size: var(--step-1); }
    p { margin: 0 0 var(--space-3); max-width: 65ch; }
    a { color: var(--accent); }
    :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
    .skip { position: absolute; left: -999px; } .skip:focus { left: var(--space-3); top: var(--space-3); background: var(--bg); padding: var(--space-2); }
    .container { width: min(100% - 2 * max(var(--space-3), env(safe-area-inset-left)), 72rem); margin-inline: auto; }
    header { border-bottom: 1px solid var(--border); padding-block: var(--space-3); }
    header .container { display: flex; align-items: center; justify-content: space-between; gap: var(--space-3); flex-wrap: wrap; }
    nav ul { display: flex; gap: var(--space-3); list-style: none; margin: 0; padding: 0; flex-wrap: wrap; }
    .hero { padding-block: var(--space-6) var(--space-5); }
    .lead { font-size: var(--step-1); color: var(--muted); }
    .btn { display: inline-flex; align-items: center; min-height: 44px; padding: 0 var(--space-4); border-radius: var(--radius); background: var(--accent); color: var(--accent-text); text-decoration: none; font-weight: 600; border: 0; cursor: pointer; }
    .grid { display: grid; gap: var(--space-4); grid-template-columns: repeat(auto-fit, minmax(min(16rem, 100%), 1fr)); padding-block: var(--space-5); }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: var(--space-4); }
    .card p { color: var(--muted); margin: 0; }
    footer { border-top: 1px solid var(--border); padding-block: var(--space-4); color: var(--muted); font-size: .9rem; }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; scroll-behavior: auto !important; } }
    @media print { header nav, .btn { display: none; } body { background: #fff; color: #000; } }
  </style>
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <header>
    <div class="container">
      <strong>Brand</strong>
      <nav aria-label="Main">
        <ul><li><a href="#features">Features</a></li><li><a href="#contact">Contact</a></li></ul>
      </nav>
    </div>
  </header>
  <main id="main">
    <section class="hero container">
      <h1>Clear headline that says what this is</h1>
      <p class="lead">One or two sentences that explain the value.</p>
      <a class="btn" href="#contact">Primary action</a>
    </section>
    <section id="features" class="container" aria-labelledby="features-title">
      <h2 id="features-title">Features</h2>
      <div class="grid">
        <article class="card"><h3>First</h3><p>Short description.</p></article>
        <article class="card"><h3>Second</h3><p>Short description.</p></article>
        <article class="card"><h3>Third</h3><p>Short description.</p></article>
      </div>
    </section>
  </main>
  <footer id="contact"><div class="container">Footer text</div></footer>
</body>
</html>
