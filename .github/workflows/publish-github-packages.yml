# Publishes the package to GitHub Packages as well, so it shows under "Packages" on the repository page.
# The main registry stays npmjs.com (`@beastab/agent-workflow-kit`, published by the maintainer with 2FA);
# this copy is the same files under the GitHub owner's scope, which GitHub Packages requires.
#
# Runs when a GitHub release is published, or by hand for a tag that already exists:
#   gh workflow run publish-github-packages.yml -f ref=v0.5.1
name: publish-github-packages
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      ref:
        description: Tag to publish (for example v0.5.1). Empty publishes the branch the run starts from.
        type: string
        default: ''

permissions: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
      - name: Use the GitHub owner as the scope
        run: npm pkg set name=@beastabtech/agent-workflow-kit
      - name: Publish to GitHub Packages
        run: npm publish --registry https://npm.pkg.github.com
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
