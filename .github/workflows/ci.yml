name: ci
on:
  push:
  pull_request:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [18, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - name: Git identity for tests
        run: |
          git config --global user.email ci@example.com
          git config --global user.name ci
      - run: npm test
      - name: JSON files parse
        shell: bash
        run: for f in .claude-plugin/*.json hooks/hooks.json templates/answers.example.json; do node -e "JSON.parse(require('fs').readFileSync('$f','utf8'))" || exit 1; done
